    <style>
        body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #f2f2f2;
}


/* Cabeçalho */

header {
    background-color: #222;
    color: white;
    padding: 20px;
    text-align: center;
}


/* Menu */

nav a {
    color: white;
    text-decoration: none;
    margin: 15px;
}


/* Conteúdo */

main {
    padding: 30px;
    text-align: center;
}


/* Produtos */

.produtos {
    display: flex;
    justify-content: center;
    gap: 30px;
    flex-wrap: wrap;
}


/* Cada produto */

.produto {
    background-color: white;
    width: 250px;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 10px #ccc;
}


/* Imagens */

.produto img {
    width: 100%;
    height: 180px;
    object-fit: contain;
}


/* Nome do produto */

.produto h3 {
    font-size: 22px;
}


/* Preço */

.produto p {
    font-size: 20px;
    font-weight: bold;
}


/* Botão */

button {
    background-color: #222;
    color: white;
    border: none;
    padding: 12px 25px;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background-color: #444;
}


/* Rodapé */

footer {
    margin-top: 40px;
    background-color: #222;
    color: white;
    text-align: center;
    padding: 20px;
}
    </style>
