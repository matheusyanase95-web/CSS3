<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Loja</title>
</head>
<body>
     <link rel="stylesheet" href="style.css">
    <style>
        body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #f2f2f2;
}

header {
    background-color: #222;
    color: white;
    padding: 20px;
    text-align: center;
}


/* Menu */

nav a {
    color: white;
    text-decoration: none;
    margin: 15px;
}


/* Conteúdo */

main {
    padding: 30px;
    text-align: center;
}


/* Produtos */

.produtos {
    display: flex;
    justify-content: center;
    gap: 30px;
    flex-wrap: wrap;
}


/* Cada produto */

.produto {
    background-color: white;
    width: 250px;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 10px #ccc;
}


/* Imagens */
.produto img {
    width: 100%;
    height: 180px;
    object-fit: contain;
}
/* Nome do produto */

.produto h3 {
    font-size: 22px;
}


/* Preço */

.produto p {
    font-size: 20px;
    font-weight: bold;
}


/* Botão */

button {
    background-color: #222;
    color: white;
    border: none;
    padding: 12px 25px;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background-color: #444;
}


/* Rodapé */

footer {
    margin-top: 40px;
    background-color: #222;
    color: white;
    text-align: center;
    padding: 20px;
}
    </style>
</head>
<body>
    
   <h1>Periféricos em Promoção</h1>
   <style>
        h1{
            color: lightblue;
        }
        p{
            color: black;
        }
    </style>

    <header>
        <h1>Minha Loja</h1>
  
        <nav>
            <a href="#">Inicio</a>
            <a href="#">Produtos</a>
            <a href="#">Contato</a>
        </nav>
    </header>

 <main>
     <h2>Produtos em Destaques</h2>
      <section class="Produtos">
         <div class="Produtos">
                <img src="img 2/Teclado.jpg" alt="Teclado">
                <h3>Teclado Gamer</h3>
                <p>R$ 150,00</p>
                <button>Comprar</button>
            </div>

            <div class="Produtos">
                <img src="img 2/Gabinete.jpg" alt="Gabinete">
                <h3>Gabinete Gamer</h3>
                <p>R$ 250,00</p>
                <button>Comprar</button>
            </div>

            <div class="Produtos">
                <img src="img 2/monitor.jpg" alt="Monitor">
                <h3>Monitor Gamer</h3>
                <p>R$ 1.250,00</p>
                <button>Comprar</button>
            </div>

            <div class="Produtos">
                <img src="img 2/mouse.webp" alt="Mouse">
                <h3>Mouse Gamer</h3>
                <p>R$ 650,00</p>
                <button>Comprar</button>
            </div>

        </section>
    </main>

    <footer>
        <p>© 2026 - Minha Loja</p>
    </footer>
      </section>
   </html>
