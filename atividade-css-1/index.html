        body {

header {

    padding: 20px;

}


/* Menu */

nav a {

}


/* Conteúdo */

main {

}


/* Produtos */

.Produtos {
    display: flex;
    flex-direction: row;
    justify-content: center;
    gap: 30px;
    flex-wrap: wrap;
}


/* Cada produto */

.produto {
    background-color: white;
    width: 250px;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 10px #ccc;
}


/* Imagens */
.produto img {
    width: 150px;
    height: 150px;
    object-fit: contain;
}
/* Nome do produto */

.produto h3 {
    font-size: 22px;
}


/* Preço */

.produto p {
    font-size: 20px;
    font-weight: bold;
}


/* Botão */

button {
    background-color: #222;
    color: white;
    border: none;
    padding: 12px 25px;
    border-radius: 5px;
    cursor: center;
}

button:hover {
    background-color: #444;
}


/* Rodapé */

footer {
    margin-top: 40px;
    background-color: #222;
    color: white;
    text-align: center;
    padding: 20px;
}
